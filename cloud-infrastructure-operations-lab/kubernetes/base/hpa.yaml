apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: northstar-api, namespace: northstar-prod }
spec: { scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: northstar-api }, minReplicas: 3, maxReplicas: 8, metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }] }
