groups:
- name: northstar-api
  rules:
  - alert: NorthstarHighErrorRate
    expr: sum(rate(http_requests_total{job="northstar-api",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="northstar-api"}[5m])) > 0.05
    for: 10m
    labels: { severity: critical, service: northstar-api }
    annotations: { summary: "Northstar API error rate above 5%", runbook: "runbooks/RB-04-application-5xx.md" }
  - alert: NorthstarLatencySLOViolation
    expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="northstar-api"}[5m]))) > 0.75
    for: 15m
    labels: { severity: warning, service: northstar-api }
    annotations: { summary: "P95 latency above 750 ms" }
