- name: Install operations packages
  ansible.builtin.package:
    name: [curl, jq, unzip, chrony]
    state: present
- name: Enable time synchronization
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
- name: Set hardened SSH configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-northstar.conf
    mode: '0600'
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      X11Forwarding no
  notify: Restart sshd
